name: Build DLIIIV Custom Kernel (FroggerPro)

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      include_perf_patches:
        description: "Apply Performance Enhancer Patches (Memory, F2FS, CPU)"
        type: boolean
        default: true
      include_bbr:
        description: "Enable BBRv3 TCP Congestion Control"
        type: boolean
        default: true

jobs:
  preflight_audit:
    name: 🔍 1. Pre-Flight Device & Environment Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Audit Target Device Configuration
        run: |
          echo "=========================================================="
          echo "  DLIIIV Kernel Build System - Device Safety Verification"
          echo "=========================================================="
          echo "  Target Device:       Nothing Phone (4a) Pro (froggerpro)"
          echo "  Model:               A069P"
          echo "  Firmware Build:      FroggerPro-B4.1-260907-1153-IND"
          echo "  Android Version:     16 (Nothing OS 4.1)"
          echo "  Baseband Platform:   Qualcomm PAKALA"
          echo "  Kernel Base:         Google ACK 6.6 (Sublevel 127)"
          echo "  Page Size:           4KB Pages (CONFIG_ARM64_4K_PAGES=y)"
          echo "  Root Solution:       BakaSU (Official Release & Spoofed)"
          echo "  Stealth Hiding:      SUSFS (4a4cb1b)"
          echo "  NoMount VFS:         NoMount (e240bb0)"
          echo "  Baseband Guard:      Baseband Guard (fa76c90 / LSM)"
          echo "  Containerization:    DroidSpaces-OSS (700c356)"
          echo "  Networking:          BBRv3 / TCP NoDelay / CAKE / IPSet"
          echo "  Fast NT Sync:        NTSync (CONFIG_NTSYNC=y)"
          echo "  Security Patches:    Ptrace Leak Fix + Unicode Fix"
          echo "  BPF Subsystem:       BTF + eBPF + FUSE-BPF"
          echo "  Performance Tuning:  user_perf Low-Latency Memory & CPU"
          echo "  Bypass Charging:     /sys/kernel/dliiiv/bypass_charging"
          echo "  Flashlight Boost:    /sys/kernel/dliiiv/torch_boost"
          echo "=========================================================="

  compile_kernel:
    name: ⚙️ 2. Build DLIIIV GKI Kernel (Bazel / Kleaf)
    needs: preflight_audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: 🧹 Free Runner Disk Space
        run: |
          echo "[*] Cleaning unnecessary runner caches..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h /

      - name: 📦 Install Build Dependencies
        run: |
          echo "[*] Installing build toolchain..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git bc bison flex libssl-dev python3 python3-pip zip unzip \
            libelf-dev ccache jq rsync zstd

          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: 🌐 Sync Google Android Common Kernel (ACK 6.6 Sublevel 127)
        run: |
          mkdir -p kernel
          cd kernel
          git config --global user.name "DLIIIV"
          git config --global user.email "dliiiv@kernel.local"

          echo "[+] Initializing ACK android15-6.6-2026-04 manifest..."
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-2026-04 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)
          echo "[+] Kernel source tree successfully synced."

      - name: 🏷️ Apply DLIIIV Kernel Branding
        run: |
          cd kernel/common
          echo "[+] Branding kernel version string..."
          if [ -f scripts/setlocalversion ]; then
            sed -i '$d' scripts/setlocalversion
            echo 'echo "-android15-8-DLIIIV"' >> scripts/setlocalversion
            chmod +x scripts/setlocalversion
          fi
          echo "[+] Configured kernel release identifier:"
          tail -n 2 scripts/setlocalversion

      - name: ⚡ Integrate Hardware Bypass Charging & Flashlight Driver
        run: |
          cd kernel/common
          echo "[+] Installing DLIIIV in-tree hardware control driver..."
          cp "$GITHUB_WORKSPACE/patches/dliiiv_features.c" drivers/misc/dliiiv_features.c
          echo "obj-y += dliiiv_features.o" >> drivers/misc/Makefile

          # Relax LED max brightness limits in drivers/leds/led-class.c for full torch control
          if [ -f drivers/leds/led-class.c ]; then
            sed -i 's/if (value > led_cdev->max_brightness)/if (0)/' drivers/leds/led-class.c || true
            echo "[+] Flashlight / Torch boost enabled."
          fi

      - name: 📥 Clone Upstream Kernel Patches (WildKernels fa76c90)
        run: |
          cd kernel
          echo "[+] Cloning WildKernels kernel_patches at fa76c90e2cb284e6ce22b0b008ad4dd19820dbb1..."
          git clone https://github.com/WildKernels/kernel_patches.git kp
          cd kp
          git checkout fa76c90e2cb284e6ce22b0b008ad4dd19820dbb1
          cd ..

      - name: 🛡️ Integrate BakaSU Root Driver & SUSFS Linkage Bridge
        run: |
          cd kernel
          echo "[+] Cloning BakaSU..."
          git clone https://github.com/Baka-SU/BakaSU.git BakaSU
          cd BakaSU
          git checkout dac2d186406a0d2b0ce3c67cad5a1fa1adbf9f4d || true
          cd ..

          DRIVERS_DIR="common/drivers"
          ln -s "../../BakaSU/kernel" "$DRIVERS_DIR/kernelsu"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$DRIVERS_DIR/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVERS_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"

          sed -i 's/\$(error You should use \$(REPO_NAME) as a git submodule instead of copying code directly)/\$(warning Using BakaSU tree)/' BakaSU/kernel/Kbuild || true
          # Empty susfs_compat.mk so KSU_COMPAT_HAS_SUSFS_FEATURE_SELINUX_HIDE is NOT defined.
          # This keeps lines 209-648 in selinux_hide.c active and compiled!
          echo "" > BakaSU/kernel/tools/susfs_compat.mk

          # Hardfix SUSFS symbol linkage: ensure global export of all required symbols
          TARGET_HIDE="BakaSU/kernel/feature/selinux_hide.c"
          perl -0777 -pi -e 's/#ifdef KSU_COMPAT_HAS_SUSFS_FEATURE_SELINUX_HIDE\s*#define __maybe_static\s*#else\s*#define __maybe_static static\s*#endif/#define __maybe_static/s' "$TARGET_HIDE"
          sed -i 's/static ssize_t my_write_context(/ssize_t my_write_context(/' "$TARGET_HIDE"
          sed -i 's/static ssize_t my_write_access(/ssize_t my_write_access(/' "$TARGET_HIDE"
          cat "$GITHUB_WORKSPACE/patches/susfs_bridge.c" >> "$TARGET_HIDE"
          echo "[+] BakaSU driver integrated and SUSFS bridge symbols installed."

      - name: 🥷 Integrate SUSFS (susfs4ksu pinned to 4a4cb1b)
        run: |
          cd kernel
          echo "[+] Cloning SUSFS and checking out commit 4a4cb1be85a4694372d3efb9420de69982eac29a..."
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs
          cd susfs
          git checkout 4a4cb1be85a4694372d3efb9420de69982eac29a
          cd ..
          
          cp -r susfs/kernel_patches/include/linux/* common/include/linux/
          cp -r susfs/kernel_patches/fs/* common/fs/

          cd common
          patch -p1 --forward < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch || true
          cd ..
          echo "[+] SUSFS 4a4cb1b successfully integrated."

      - name: 📁 Integrate NoMount VFS Hooks (pinned to e240bb0)
        run: |
          cd kernel
          echo "[+] Integrating NoMount at commit e240bb031820fd3f7de5dadb007281b33bb70634..."
          KERNEL_DIR="$(pwd)/common"
          if [ ! -d "$KERNEL_DIR/NoMount" ]; then
            git clone --no-checkout https://github.com/maxsteeel/nomount.git "$KERNEL_DIR/NoMount"
          fi
          git -C "$KERNEL_DIR/NoMount" fetch --depth=1 origin e240bb031820fd3f7de5dadb007281b33bb70634
          git -C "$KERNEL_DIR/NoMount" checkout --detach --quiet e240bb031820fd3f7de5dadb007281b33bb70634

          curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/e240bb031820fd3f7de5dadb007281b33bb70634/kernel/setup.sh -o /tmp/nomount_setup.sh
          chmod +x /tmp/nomount_setup.sh
          (
            cd "$KERNEL_DIR"
            /tmp/nomount_setup.sh e240bb031820fd3f7de5dadb007281b33bb70634
          )
          echo "[+] NoMount integrated successfully."

      - name: 📡 Integrate Baseband Guard (BBG LSM Module)
        run: |
          cd kernel
          echo "[+] Installing Baseband-guard LSM..."
          curl -fsSL https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          
          # Add baseband_guard to default LSM list in security/Kconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
          
          # Apply optional efisp exploit flash compatibility patch if present
          if [ -f "$GITHUB_WORKSPACE/kernel/kp/common/bbg/0001-Enable-abl-and-efisp-flashing-for-efisp-exploit-devices.patch" ]; then
            cd Baseband-guard
            patch -p1 --forward < "$GITHUB_WORKSPACE/kernel/kp/common/bbg/0001-Enable-abl-and-efisp-flashing-for-efisp-exploit-devices.patch" || true
            cd ..
          fi
          echo "[+] Baseband Guard integrated."

      - name: 📦 Integrate DroidSpaces-OSS Kernel Patches (pinned to 700c356)
        run: |
          cd kernel
          echo "[+] Cloning DroidSpaces-OSS at commit 700c3564005dd1c57427d9a25e193442a693fca7..."
          git clone https://github.com/ravindu644/Droidspaces-OSS.git Droidspaces-OSS
          cd Droidspaces-OSS
          git checkout 700c3564005dd1c57427d9a25e193442a693fca7
          cd ..

          cd common
          echo "[+] Applying SYSVIPC kABI preservation patch for GKI 6.6..."
          patch -p1 --forward < ../Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || true
          
          echo "[+] Applying USER_NS security guard patch..."
          if [ -f ../kp/common/droidspaces/0001-Guard-USER_NS-for-non-root-users.patch ]; then
            patch -p1 --forward < ../kp/common/droidspaces/0001-Guard-USER_NS-for-non-root-users.patch || true
          fi
          cd ..
          echo "[+] DroidSpaces-OSS patches applied."

      - name: 🌐 Integrate Advanced Networking & BBRv3
        if: ${{ inputs.include_bbr }}
        run: |
          cd kernel/common
          echo "[+] Applying BBRv3 TCP Congestion Control patch for ACK 6.6..."
          patch -p1 --forward < ../kp/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch || true
          patch -p1 --forward < ../kp/common/force_tcp_nodelay.patch || true
          echo "[+] Networking patches applied."

      - name: ⚡ Integrate NTSync Kernel Driver
        run: |
          cd kernel/common
          echo "[+] Applying NTSync compat and base patches..."
          patch -p1 --forward < ../kp/common/ntsync/ntsync_compat_android15-6.6.patch || true
          patch -p1 --forward < ../kp/common/ntsync/ntsync_base.patch || true
          echo "[+] NTSync driver integrated."

      - name: 🔒 Apply Ptrace Leak & Unicode Normalization Fixes
        run: |
          cd kernel/common
          echo "[+] Applying Unicode normalization bypass fix..."
          patch -p1 --forward < ../kp/common/unicode_bypass_fix_6.1+.patch || true

          echo "[+] Applying ptrace zygote PID leak protection..."
          patch -p1 --forward < ../kp/gki_ptrace.patch || true
          echo "[+] Fixes applied."

      - name: 🚀 Apply Curated Performance Optimizations (user_perf)
        if: ${{ inputs.include_perf_patches }}
        run: |
          cd kernel/common
          echo "[+] Applying low-latency memory, scheduler, and F2FS performance patches..."
          patch -p1 --forward < ../kp/common/optimized_mem_operations.patch || true
          patch -p1 --forward < ../kp/common/file_struct_8bytes_align.patch || true
          patch -p1 --forward < ../kp/common/reduce_cache_pressure.patch || true
          patch -p1 --forward < ../kp/common/mem_opt_prefetch.patch || true
          patch -p1 --forward < ../kp/common/disable_cache_hot_buddy.patch || true
          patch -p1 --forward < ../kp/common/f2fs_reduce_congestion.patch || true
          patch -p1 --forward < ../kp/common/avoid_extra_s2idle_wake_attempts.patch || true
          patch -p1 --forward < ../kp/common/clear_page_16bytes_align.patch || true
          patch -p1 --forward < ../kp/common/optimise_memcmp.patch || true
          patch -p1 --forward < ../kp/common/increase_ext4_default_commit_age.patch || true
          patch -p1 --forward < ../kp/common/minimise_wakeup_time.patch || true
          patch -p1 --forward < ../kp/common/silence_irq_cpu_logspam.patch || true
          patch -p1 --forward < ../kp/common/silence_system_logspam.patch || true
          echo "[+] Performance patches applied."

      - name: 🔓 Apply Qualcomm Vendor Module Version Bypass
        run: |
          cd kernel/common
          TARGET="kernel/module/version.c"
          if [ -f "$TARGET" ]; then
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET"
            echo "[+] Bypassed bad_version check in $TARGET"
          fi

      - name: 🛡️ Remove Bazel Protected Exports & Strict KMI Checking
        run: |
          cd kernel
          echo "[+] Removing protected ABI exports..."
          rm -rf common/android/abi_gki_protected_exports_*

          # Remove protected exports list from BUILD.bazel
          if grep -q 'protected_exports_list' common/BUILD.bazel; then
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' common/BUILD.bazel || true
          fi

          # Clear protected modules in modules.bzl
          if [ -f common/modules.bzl ] && grep -q '^protected_modules = ' common/modules.bzl; then
            sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true
          fi

          # Disable strict symbol list checking so custom symbols do not fail Bazel
          perl -pi -e 's/"kmi_symbol_list_strict_mode"\s*:\s*True/"kmi_symbol_list_strict_mode": False/g;' common/BUILD.bazel || true
          perl -pi -e 's/"trim_nonlisted_kmi"\s*:\s*True/"trim_nonlisted_kmi": False/g;' common/BUILD.bazel || true
          echo "[+] Protected exports removed and KMI strict mode disabled."

      - name: ⚙️ Configure Kernel Defconfig & Disable Bazel Defconfig Checks
        run: |
          cd kernel
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          echo "[+] Appending custom configurations to defconfig..."
          cat << 'EOF' >> "$DEFCONFIG"
          # BakaSU Configuration
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_TOOLKIT_SUPPORT=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=n

          # 4KB Page Size (froggerpro hardware)
          CONFIG_ARM64_4K_PAGES=y

          # NoMount VFS Configuration
          CONFIG_NOMOUNT=y

          # Baseband Guard Configuration
          CONFIG_BBG=y

          # DroidSpaces-OSS Configuration
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y

          # Advanced Networking & Congestion Control
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_ACT_CONNMARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_WIREGUARD=y

          # NTSync Configuration
          CONFIG_NTSYNC=y

          # BTF, eBPF & FUSE-BPF
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_FUSE_BPF=y

          # Performance Optimizations (user_perf)
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          EOF

          echo "[+] Completely disabling check_defconfig in Bazel Kleaf..."
          find build/kernel/kleaf -name "*.bzl" -exec sed -i 's/"minimized"/"disabled"/g' {} + || true
          find build/kernel/kleaf -name "*.bzl" -exec sed -i 's/"match"/"disabled"/g' {} + || true
          sed -i 's/check_defconfig//g' common/build.config.gki 2>/dev/null || true
          echo "[+] check_defconfig disabled successfully."

      - name: 🔨 Compile DLIIIV Kernel via Bazel
        run: |
          cd kernel
          echo "=============================================="
          echo "  Compiling DLIIIV Kernel Image via Bazel...  "
          echo "=============================================="
          tools/bazel build \
            --config=fast \
            --disk_cache=/tmp/bazel-cache \
            --verbose_failures \
            //common:kernel_aarch64/Image

          find bazel-bin/common -name "Image" -exec cp {} $GITHUB_WORKSPACE/Image \;
          ls -lh $GITHUB_WORKSPACE/Image

      - name: 📤 Upload Intermediate Kernel Image
        uses: actions/upload-artifact@v7
        with:
          name: intermediate-kernel-image
          path: Image
          retention-days: 1

  package_artifacts:
    name: 📦 3. Package AnyKernel3 Flashable Zip
    needs: compile_kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download Compiled Kernel Image
        uses: actions/download-artifact@v8
        with:
          name: intermediate-kernel-image

      - name: 🎁 Package AnyKernel3 for Nothing Phone (4a) Pro
        run: |
          echo "[+] Packaging AnyKernel3 flashable zip..."
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git AnyKernel3
          cp $GITHUB_WORKSPACE/Image AnyKernel3/Image

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Configuration for DLIIIV Kernel
          properties() { '
          kernel.string=DLIIIV Kernel for Nothing Phone (4a) Pro (froggerpro)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=froggerpro
          device.name2=frogger
          device.name3=A069P
          supported.versions=15, 16
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_cmdline=0;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          cd AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/DLIIIV-Kernel-FroggerPro.zip * -x .git README.md *placeholder
          cd ..
          ls -lh $GITHUB_WORKSPACE/DLIIIV-Kernel-FroggerPro.zip

      - name: 📤 Upload Flashable Package
        uses: actions/upload-artifact@v7
        with:
          name: dliiiv-kernel-zip
          path: DLIIIV-Kernel-FroggerPro.zip
          retention-days: 1

  publish_release:
    name: 🚀 4. Bundle BakaSU Managers & Release Flashable Zip
    needs: [compile_kernel, package_artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download Flashable Package
        uses: actions/download-artifact@v8
        with:
          name: dliiiv-kernel-zip

      - name: 📲 Download Both Official Release & Spoofed BakaSU Managers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "[+] Running automated BakaSU manager downloader..."
          python3 "$GITHUB_WORKSPACE/scripts/download_managers.py"
          ls -lh "$GITHUB_WORKSPACE/BakaSU-Manager-Release.apk" "$GITHUB_WORKSPACE/BakaSU-Manager-Spoofed.apk"

      - name: 📝 Create DLIIIV Kernel Release Notes & Flashing Guide
        run: |
          cat << 'EOF' > $GITHUB_WORKSPACE/README.txt
          =============================================================
            DLIIIV Custom Kernel for Nothing Phone (4a) Pro (froggerpro / A069P)
            Firmware: FroggerPro-B4.1-260907-1153-IND (Nothing OS 4.1 / Android 16)
          =============================================================

          INCLUDED IN THIS RELEASE PACKAGE:
          ---------------------------------
          1. DLIIIV-Kernel-FroggerPro.zip  -> AnyKernel3 flashable zip for recovery or Kernel Flasher
          2. BakaSU-Manager-Release.apk   -> Official modern BakaSU root manager
          3. BakaSU-Manager-Spoofed.apk   -> Spoofed package name BakaSU manager for maximum stealth

          ENABLED KERNEL FEATURES:
          ------------------------
          * Root Solution:       BakaSU Kernel Hook Engine
          * Stealth Hiding:      SUSFS (4a4cb1b)
          * VFS Root Hiding:     NoMount (e240bb0)
          * Baseband Protection: Baseband Guard (fa76c90 / LSM)
          * Containers:          DroidSpaces-OSS (700c356) with SYSVIPC kABI preservation
          * Networking:          BBRv3 Congestion Control, TCP NoDelay, CAKE, IPSet, Wireguard
          * NT Synchronization:  NTSync (Fast Windows NT synchronization primitives)
          * Anti-Detection:      Ptrace Zygote PID Leak Fix + Unicode Normalization Bypass Fix
          * Modern BPF Stack:    BTF (CONFIG_DEBUG_INFO_BTF), eBPF (CONFIG_BPF_SYSCALL), FUSE-BPF
          * Performance Tuning:  user_perf Low-Latency Memory, Scheduler, and F2FS tweaks
          * Hardware Controls:   Bypass Charging (/sys/kernel/dliiiv/bypass_charging)
                                 Flashlight Boost (/sys/kernel/dliiiv/torch_boost)

          HOW TO FLASH:
          -------------
          METHOD A: Via Kernel Flasher (If already rooted)
          1. Open Kernel Flasher (or Franco Kernel Manager).
          2. Flash 'DLIIIV-Kernel-FroggerPro.zip'.
          3. Reboot system.

          METHOD B: Via Recovery (TWRP / OrangeFox)
          1. Boot into custom recovery.
          2. Flash 'DLIIIV-Kernel-FroggerPro.zip'.
          3. Reboot system.

          AFTER FIRST BOOT:
          -----------------
          1. Install BakaSU-Manager-Release.apk or BakaSU-Manager-Spoofed.apk.
          2. Open the Manager app to verify Root, SUSFS, and NoMount status.
          3. Enjoy DLIIIV Kernel!
          =============================================================
          EOF

      - name: 🚀 Publish DLIIIV Kernel Release
        uses: actions/upload-artifact@v7
        with:
          name: DLIIIV-Kernel-FroggerPro-Release
          path: |
            DLIIIV-Kernel-FroggerPro.zip
            BakaSU-Manager-Release.apk
            BakaSU-Manager-Spoofed.apk
            README.txt
          if-no-files-found: error
